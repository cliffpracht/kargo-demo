apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: istio
  namespace: istio
spec:
  promotionPolicies:
    - autoPromotionEnabled: true
      stageSelector:
        name: uat
    - autoPromotionEnabled: true
      stageSelector:
        name: prod
    - autoPromotionEnabled: true
      stageSelector:
        name: test